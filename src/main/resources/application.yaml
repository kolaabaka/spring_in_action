spring:
  lifecycle.timeout-per-shutdown-ohase: 20s #default 30s
  application:
    name: spring_in_action

  rsocket:
    server:
      port: 7000

  thymeleaf: false #template caching, don`t need in developing
  datasource:
    platform: postgres
    url:
    username:
    password:
    name: streetFood
    generate-unique-name: false

  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_schema:

  data:
    mongodb:
      host: localhost
      port: 27017
      database: comments

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

server:
  shutdown: graceful

logging:
  level:
    root: INFO